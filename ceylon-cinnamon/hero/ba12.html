<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
#s{width:1440px;height:1440px;position:relative;overflow:hidden;font-family:'Inter',sans-serif;color:#1E1410;background:#F7F0E6}
.ph{position:absolute;top:0;width:720px;height:960px;background-size:auto 1240px;background-repeat:no-repeat}
.b{left:0;background-image:url(soul-before.png);background-position:50% 30%;filter:saturate(.9)}
.a{left:720px;background-image:url(soul-after.png);background-position:50% 45%}
.tag{position:absolute;top:70px;transform:translateY(-50%);border-radius:999px;padding:12px 30px;font-weight:900;font-size:26px;letter-spacing:5px}
.tb{left:360px;margin-left:-82px;background:#1E1410;color:#fff}
.ta{left:1080px;margin-left:-74px;background:#A8441C;color:#fff}
.ph{height:900px}
.strip{position:absolute;left:0;right:0;top:900px;height:470px;display:grid;grid-template-columns:1fr 1fr}
.half{position:relative;padding:96px 64px 0}
.half.l{background:#EDE3D6}
.half.r{background:#FFFDF9}
.lab{font-weight:900;font-size:22px;letter-spacing:5px;color:#8A7260}
.half.r .lab{color:#A8441C}
.row{display:flex;align-items:center;gap:20px;margin-top:40px;font-weight:800;font-size:40px;letter-spacing:-.6px}
.half.l .row{color:#7A6555}
.half.l .row span{text-decoration:line-through;text-decoration-color:rgba(168,68,28,.55);text-decoration-thickness:3px}
.ic{flex:0 0 52px;height:52px;border-radius:50%;display:grid;place-items:center}
.half.l .ic{background:#D9CBB8}
.half.r .ic{background:#A8441C}
.ic svg{width:28px;height:28px;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.half.l .ic svg{stroke:#7A6555}.half.r .ic svg{stroke:#fff}
.sup{color:#A8441C;font-size:.6em;vertical-align:super;margin-left:-14px}
.mid{position:absolute;left:720px;top:900px;transform:translate(-50%,-50%);width:150px;height:150px;border-radius:50%;background:#1E1410;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 0 10px #F7F0E6;z-index:3}
.mid .n{font-family:'Inter Display';font-weight:900;font-size:44px;color:#F6C945;line-height:1}
.mid .t{font-weight:800;font-size:17px;letter-spacing:2px;margin-top:4px}
.foot{position:absolute;left:0;right:0;bottom:0;height:70px;background:#1E1410;color:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600}
</style></head><body><div id="s">
<div class="ph b"></div><div class="ph a"></div><div class="line"></div>
<div class="tag tb">BEFORE</div><div class="tag ta">AFTER</div>
<div class="strip">
 <div class="half l"><div class="lab">MOST AFTERNOONS</div>
  <div class="row"><span class="ic"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></span><span>Heavy after meals</span></div>
  <div class="row"><span class="ic"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></span><span>The 3pm slump</span></div>
  <div class="row"><span class="ic"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></span><span>Craving sweets</span></div></div>
 <div class="half r"><div class="lab">WITH 1 SOFTGEL A DAY</div>
  <div class="row"><span class="ic"><svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg></span>Lighter after meals<span class="sup">*</span></div>
  <div class="row"><span class="ic"><svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg></span>Steadier energy<span class="sup">*</span></div>
  <div class="row"><span class="ic"><svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg></span>Healthy blood sugar<span class="sup">*</span></div></div>
</div>
<div class="mid"><div class="n">1</div><div class="t">A DAY</div></div>
<div class="foot">*Not evaluated by the FDA. Not intended to diagnose, treat, cure or prevent any disease. Results vary. Models shown.</div>
</div></body></html>
